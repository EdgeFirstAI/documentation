name: publish

on:
  push:
    branches:
      - test
      - stage
      - saas

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          lfs: true

      # Installs uv and Python, then runs `uv sync --locked` against uv.lock.
      - uses: EdgeFirstAI/.github/.github/actions/setup-python-uv@0cbb8f91f0d3e7d15726329f3fa651450bfdbbf0  # v5.1.0

      - name: Lint Markdown
        run: |
          npm install -g markdownlint-cli2
          markdownlint-cli2 "docs/**/*.md" || true
        continue-on-error: true

      - name: Configure Git user
        run: |
          git config --local user.email "support@edgefirst.ai"
          git config --local user.name "EdgeFirst AI"

      - name: Fetch gh-pages
        run: git fetch origin gh-pages --depth=1

      - name: Deploy to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run --locked mike deploy --push ${{ github.ref_name }}

      - name: Set default version
        if: github.ref_name == 'saas'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run --locked mike set-default --push latest
