name: publish

on:
  push:
    branches:
      - test
      - stage
      - saas

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure Git user
        run: |
          git config --local user.email "support@edgefirst.ai"
          git config --local user.name "EdgeFirst AI"

      - name: Deploy to GitHub Pages
        run: mike deploy --push $GITHUB_REF_NAME
