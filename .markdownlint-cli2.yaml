# Configuration for markdownlint-cli2
# See: https://github.com/DavidAnson/markdownlint/blob/main/doc/Rules.md

config:
  # Disable line length - not practical for documentation with links and tables
  MD013: false
  
  # Allow inline HTML - needed for MkDocs figures, figcaption, etc.
  MD033: false
  
  # Allow multiple headings with same content - common in docs with repeated sections
  MD024: false
  
  # Blank lines around headings - enforce
  MD022: true
  
  # Blank lines around lists - enforce
  MD032: true
  
  # Blank lines around fences - enforce
  MD031: true
  
  # Disable code block style - MkDocs admonitions need indented blocks
  MD046: false
  
  # No trailing spaces
  MD009: true
  
  # Code blocks should have language specified
  MD040: true
  
  # Disable table column style - tables are readable without strict alignment
  MD060: false
